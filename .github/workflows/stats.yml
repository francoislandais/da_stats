name: Relevé DeviantArt

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relevé + export
        env:
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_USERNAME: ${{ vars.DA_USERNAME }}
          DA_DB: data/da_stats.db
          DA_STORE_RAW: "0"
        run: |
          mkdir -p data
          python3 da_stats.py once
          python3 da_stats.py export
      - name: Commit des données
        run: |
          git config user.name "da-stats-bot"
          git config user.email "da-stats-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "Relevé $(date -u +'%F %H:%M') UTC"
          git push
